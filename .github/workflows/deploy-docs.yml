name: Deploy for Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # the demo catalog is the library's own catalog
      - 'packages/svelte-zukan/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# one Pages deployment at a time, and a running one is never cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 15
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: $/.github/workflows/setup-node
      - name: Build docs
        run: pnpm --filter docs build
      - name: Build the demo catalog
        run: pnpm --filter svelte-zukan build
      - name: Put the demo catalog under the docs
        run: cp -r packages/svelte-zukan/zukan-dist docs/dist/demo
      - name: Build the Japanese demo catalog
        run: pnpm --filter svelte-zukan build
        env:
          ZUKAN_DEMO_LOCALE: ja
      - name: Put the Japanese demo catalog under the docs
        run: cp -r packages/svelte-zukan/zukan-dist docs/dist/demo/ja
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
