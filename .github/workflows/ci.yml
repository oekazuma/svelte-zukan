name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.changeset/**'
      - '.vscode/**'
      - '**/.github/**/*.md'
  pull_request:
  # release.yml starts it on the Version Packages branch: a pull request opened with GITHUB_TOKEN triggers no workflow
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # installing pnpm can stall for about 5 minutes before npm retries
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: $/.github/workflows/setup-node
      - name: Run Prettier check & ESLint
        run: pnpm run lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: $/.github/workflows/setup-node
      - name: Run svelte-package
        run: pnpm run package
      # tests and the library's own catalog files must not reach consumers
      - name: Check the published files
        working-directory: packages/svelte-zukan
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            // an array in npm 11, an object keyed by package name in npm 12
            const files = Object.values(require(process.argv[1]))[0].files.map((f) => f.path);
            const bad = files.filter((f) => /\.(test|spec)\.|\.zukan\.(svelte|md)$|\.zukan\.svelte\.d\.ts$/.test(f));
            const missing = ["dist/vite/index.js", "skills/svelte-zukan/SKILL.md"].filter((f) => !files.includes(f));
            if (bad.length || missing.length) {
              console.error([...bad, ...missing.map((f) => `${f} is missing`)].join("\n"));
              process.exit(1);
            }
          ' "$RUNNER_TEMP/pack.json"
      - name: Run svelte-check
        run: pnpm run check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: $/.github/workflows/setup-node
      - name: Run svelte-package
        run: pnpm run package
      - name: Build example app
        run: pnpm --filter example build
      - name: Build docs
        run: pnpm --filter docs build
      - name: Setup Playwright
        uses: $/.github/workflows/setup-playwright
      - name: Run Vitest
        run: pnpm run test
      - name: Run the build tests with the packaged library
        run: pnpm --filter build-tests exec vitest run build.test.ts
        env:
          ZUKAN_FROM_DIST: '1'

  # drive-letter paths and the fixtures' directory junctions
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm/action-setup self-updates to the packageManager version, which leaves a broken
      # pnpm shim on Windows (`pnpm store path` fails), so install pnpm with npm here instead
      - name: Get Node.js and pnpm versions from package.json
        id: versions
        shell: bash
        run: |
          echo "node=$(jq -r '.devEngines.runtime.version' package.json | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(jq -r '.packageManager' package.json | tr -d '\r' | sed 's/^pnpm@//; s/+.*$//')" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install pnpm
        shell: bash
        env:
          PNPM_VERSION: ${{ steps.versions.outputs.pnpm }}
        run: |
          npm install -g "pnpm@${PNPM_VERSION}"
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Run Vitest (library server tests)
        run: pnpm --filter svelte-zukan exec vitest run --project server
      # dev.test.ts needs the packaged library and Chromium, which this job does not set up
      - name: Run Vitest (build tests)
        run: pnpm --filter build-tests exec vitest run build.test.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: $/.github/workflows/setup-node
      - name: Build the library's site and catalog
        run: pnpm --filter svelte-zukan build
      - name: Check that the catalog was written
        run: test -f packages/svelte-zukan/zukan-dist/index.html

  # the published engines.node floor, on a user-style install of the packed library;
  # every other job runs the dev toolchain on devEngines.runtime instead
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: $/.github/workflows/setup-node
      - name: Pack the library
        run: |
          pnpm run package
          cd packages/svelte-zukan && npm pack --pack-destination "$RUNNER_TEMP" --ignore-scripts
      - name: Get the Node floor from engines.node
        id: floor
        run: echo "node=$(jq -r '.engines.node' packages/svelte-zukan/package.json | sed 's/^>=//')" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js at the floor
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.floor.outputs.node }}
      - name: Run the floor smoke
        run: node scripts/floor-smoke.mjs "$RUNNER_TEMP"/svelte-zukan-*.tgz
