name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.vscode/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '.vscode/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run Prettier check & ESLint
        run: pnpm lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run svelte-check
        run: pnpm check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Vitest
        run: pnpm test:run

  # drive-letter paths and the fixtures' directory junctions
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm/action-setup self-updates to the packageManager version, which leaves a broken
      # pnpm shim on Windows (`pnpm store path` fails), so install pnpm with npm here instead
      - name: Get Node.js and pnpm versions from package.json
        id: versions
        shell: bash
        run: |
          echo "node=$(jq -r '.devEngines.runtime.version' package.json | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(jq -r '.packageManager' package.json | tr -d '\r' | sed 's/^pnpm@//; s/+.*$//')" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install pnpm and dependencies
        shell: bash
        env:
          PNPM_VERSION: ${{ steps.versions.outputs.pnpm }}
        run: |
          npm install -g "pnpm@${PNPM_VERSION}"
          pnpm install --frozen-lockfile
      - name: Run Vitest (server)
        run: pnpm exec vitest run --project server

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run Build
        run: pnpm build
