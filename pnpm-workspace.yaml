packages:
  - docs/
  - example/
  - packages/*
  - tests/*

minimumReleaseAge: 4320

allowBuilds:
  sharp: true

# takumi 2.16 renamed FontSubset's `ranges`, which blume 2.2.3 still reads; the docs build
# then fails on the OG images of the Japanese pages. Drop this once blume reads the new field.
overrides:
  takumi-js: 2.16.3

catalog:
  '@changesets/cli': ^3.0.3
  '@eslint/js': ^10.0.1
  '@sveltejs/adapter-static': ^4.0.0
  '@sveltejs/kit': ^3.0.1
  '@sveltejs/package': ^2.5.8
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@types/node': ^24.19.2
  '@vitejs/devtools': ^0.7.6
  '@vitest/browser-playwright': ^4.1.11
  blume: ^2.2.3
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.23.1
  globals: ^17.13.0
  playwright: ^1.64.0
  prettier: ^3.9.10
  prettier-plugin-svelte: ^4.1.1
  publint: ^0.3.25
  svelte: ^5.57.2
  svelte-check: ^4.7.6
  typescript: ^6.0.3
  typescript-eslint: ^8.71.2
  vite: ^8.3.4
  vite-plugin-inspect: ^12.1.0
  vitest: ^4.1.11
  vitest-browser-svelte: ^2.2.1
