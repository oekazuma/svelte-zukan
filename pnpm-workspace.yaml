packages:
  - docs/
  - example/
  - packages/*
  - tests/*

minimumReleaseAge: 4320

allowBuilds:
  sharp: true

# takumi 2.16 renamed FontSubset's `ranges`, which blume (up to 2.2.4) still reads; the docs build
# then fails on the OG images of the Japanese pages. Drop this once blume reads the new field.
overrides:
  takumi-js: 2.15.2
  # Security fixes for transitive dependencies (through blume and eslint only) whose parents pin a
  # vulnerable version or a major without the fix. Drop each once its parent allows the fixed one.
  '@tailwindcss/typography>postcss-selector-parser': ^7.2.0
  '@vercel/routing-utils>path-to-regexp': ^6.3.0
  # The fixes exist only in glob 14 and minimatch 11. @vercel/nft calls only glob(pattern, options);
  # eslint and typescript-eslint call only minimatch() and Minimatch#match(), which minimatch 11 keeps.
  glob@13: ^14.0.5
  minimatch@10: ^11.0.8

# @astrojs/astro2tsx 0.1.3 depends on @emnapi/core 1.x but not on @emnapi/runtime, so pnpm gives
# it the 2.0 beta that rolldown's wasm binding brings, and `blume check` fails in emnapi
# (this.bridge.setLastError is not a function). 0.1.4 declares it; drop this once the lockfile has 0.1.4.
packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3

catalog:
  '@changesets/cli': ^3.0.3
  '@eslint/js': ^10.0.1
  '@sveltejs/adapter-static': ^4.0.1
  '@sveltejs/kit': ^3.2.0
  '@sveltejs/package': ^3.0.2
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@tailwindcss/node': 4.3.5
  '@tailwindcss/vite': 4.3.5
  '@types/node': ^26.6.6
  '@vitejs/devtools': ^0.7.6
  '@vitest/browser-playwright': ^5.1.0
  blume: ^2.2.7
  eslint: ^10.14.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.24.1
  globals: ^17.14.0
  playwright: ^1.65.0
  prettier: ^3.10.0
  prettier-plugin-svelte: ^4.1.1
  publint: ^0.3.25
  svelte: ^5.57.3
  svelte-check: ^4.7.8
  tailwindcss: 4.3.5
  typescript: ^6.0.3
  typescript-eslint: ^8.72.2
  vite: ^8.3.8
  vite-plugin-inspect: ^12.1.0
  vitest: ^5.1.0
  vitest-browser-svelte: ^3.1.0
