packages:
  - docs/
  - example/
  - packages/*
  - tests/*

minimumReleaseAge: 4320

allowBuilds:
  sharp: true

# takumi 2.16 renamed FontSubset's `ranges`, which blume (up to 2.2.4) still reads; the docs build
# then fails on the OG images of the Japanese pages. Drop this once blume reads the new field.
overrides:
  takumi-js: 2.15.2

catalog:
  '@changesets/cli': ^3.0.3
  '@eslint/js': ^10.0.1
  '@sveltejs/adapter-static': ^4.0.0
  '@sveltejs/kit': ^3.1.0
  '@sveltejs/package': ^3.0.1
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@tailwindcss/node': 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@types/node': ^24.19.2
  '@vitejs/devtools': ^0.7.6
  '@vitest/browser-playwright': ^5.0.5
  blume: ^2.2.5
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.23.1
  globals: ^17.13.0
  playwright: ^1.64.1
  prettier: ^3.9.10
  prettier-plugin-svelte: ^4.1.1
  publint: ^0.3.25
  svelte: ^5.57.2
  svelte-check: ^4.7.7
  tailwindcss: 4.3.3
  typescript: ^6.0.3
  typescript-eslint: ^8.72.0
  vite: ^8.3.5
  vite-plugin-inspect: ^12.1.0
  vitest: ^5.0.5
  vitest-browser-svelte: ^3.1.0
